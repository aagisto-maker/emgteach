<svg viewBox="0 0 680 510" xmlns="http://www.w3.org/2000/svg" width="680" height="510" font-family="DejaVu Sans, Arial, sans-serif">
  <title>Colocación y orientación del acelerómetro para el curl de bíceps (emgteach)</title>
  <rect x="0" y="0" width="680" height="510" fill="#ffffff"/>
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#BA7517"/></marker>
    <marker id="axL" markerWidth="9" markerHeight="9" refX="1" refY="3" orient="auto"><path d="M7,0 L0,3 L7,6 Z" fill="#0F6E56"/></marker>
    <marker id="axR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#0F6E56"/></marker>
    <marker id="gv" markerWidth="9" markerHeight="9" refX="4" refY="7" orient="auto"><path d="M0,0 L4,7 L8,0 Z" fill="#888780"/></marker>
  </defs>

  <text x="24" y="32" fill="#2C2C2A" font-size="16" font-weight="bold">Curl de bíceps — colocación del acelerómetro (emgteach)</text>

  <path d="M300,370 Q400,225 262,90" fill="none" stroke="#BA7517" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/>
  <text x="405" y="160" fill="#BA7517" font-size="12">levantamiento</text>
  <text x="405" y="177" fill="#BA7517" font-size="12">(rápido)</text>

  <line x1="150" y1="80" x2="150" y2="240" stroke="#888780" stroke-width="14" stroke-linecap="round"/>
  <line x1="150" y1="240" x2="322" y2="160" stroke="#888780" stroke-width="14" stroke-linecap="round"/>
  <circle cx="150" cy="240" r="9" fill="#5F5E5A"/>
  <text x="115" y="262" fill="#5F5E5A" font-size="11">codo (pivote)</text>

  <circle cx="340" cy="186" r="17" fill="#5F5E5A"/>
  <text x="330" y="221" fill="#5F5E5A" font-size="11">carga</text>

  <circle cx="176" cy="130" r="5.5" fill="#378ADD"/>
  <circle cx="176" cy="160" r="5.5" fill="#378ADD"/>
  <text x="62" y="138" fill="#185FA5" font-size="12">EMG</text>
  <text x="47" y="155" fill="#185FA5" font-size="12">(bíceps)</text>

  <g transform="translate(255,178) rotate(-25)">
    <rect x="-24" y="-13" width="48" height="26" rx="4" fill="#1D9E75"/>
    <text x="0" y="4" text-anchor="middle" fill="#04342C" font-size="12" font-weight="bold">ACC</text>
  </g>
  <line x1="205" y1="215" x2="300" y2="170" stroke="#0F6E56" stroke-width="2.5" marker-start="url(#axL)" marker-end="url(#axR)"/>
  <text x="150" y="312" fill="#0F6E56" font-size="12" font-weight="bold">eje sensible = dirección del movimiento</text>
  <text x="150" y="330" fill="#5F5E5A" font-size="11">en el antebrazo, cerca de la muñeca (segmento móvil)</text>

  <line x1="600" y1="370" x2="600" y2="425" stroke="#888780" stroke-width="2.5" marker-end="url(#gv)"/>
  <text x="610" y="402" fill="#5F5E5A" font-size="12">g</text>

  <line x1="24" y1="355" x2="360" y2="355" stroke="#D3D1C7" stroke-width="1"/>

  <g transform="translate(40,372)">
    <rect x="0" y="0" width="270" height="55" rx="6" fill="none" stroke="#1D9E75" stroke-width="1.5"/>
    <line x1="8" y1="27" x2="262" y2="27" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M8,27 L60,27 L75,26 L95,28 L120,10 L140,44 L160,26 L200,27 L262,27" fill="none" stroke="#1D9E75" stroke-width="2"/>
    <text x="0" y="-8" fill="#0F6E56" font-size="12">correcto: reposo a MEDIA escala -&gt; se ve el pico</text>
  </g>

  <g transform="translate(40,450)">
    <rect x="0" y="0" width="270" height="50" rx="6" fill="none" stroke="#D85A30" stroke-width="1.5"/>
    <line x1="8" y1="43" x2="262" y2="43" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M8,43 L262,43" fill="none" stroke="#D85A30" stroke-width="2"/>
    <text x="0" y="-8" fill="#993C1D" font-size="12">mal: pegado al riel -&gt; 0.000, sin señal</text>
  </g>

  <g transform="translate(380,372)" fill="#2C2C2A">
    <text x="0" y="0" font-size="13" font-weight="bold">Pasos</text>
    <text x="0" y="24" fill="#5F5E5A" font-size="12">1 - ACC firme en el antebrazo, junto a la muñeca.</text>
    <text x="0" y="46" fill="#5F5E5A" font-size="12">2 - Gira el sensor hasta que, en reposo, el</text>
    <text x="14" y="63" fill="#5F5E5A" font-size="12">trazo del ACC quede en el centro del plot.</text>
    <text x="0" y="85" fill="#5F5E5A" font-size="12">3 - Levantamiento de prueba: pico claro.</text>
    <text x="0" y="107" fill="#5F5E5A" font-size="12">4 - EMG en el vientre del bíceps.</text>
  </g>
</svg>
