<text x="500.0" y="62" font-size="13" text-anchor="middle" fill="#55636F">Right forearm. Seated, elbow at 90°, forearm supported and pronated.</text>
<text x="252.0" y="96" font-size="14.5" font-weight="bold" text-anchor="middle" fill="#0D7D7D">Anterior (volar) aspect · Channel 1</text>
<text x="252.0" y="116" font-size="13.5" text-anchor="middle" fill="#16202A" font-weight="600">Flexor carpi radialis</text>
<text x="252.0" y="132" font-size="11.5" text-anchor="middle" fill="#55636F">(wrist flexor)</text>
