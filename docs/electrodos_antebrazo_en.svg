<text x="702.0" y="556" font-size="11.5" text-anchor="middle" fill="#55636F" font-weight="400">Check: wrist extension with a closed fist.</text><text x="702.0" y="570" font-size="11.5" text-anchor="middle" fill="#55636F" font-weight="400">The bulge appears just distal to the epicondyle.</text>
