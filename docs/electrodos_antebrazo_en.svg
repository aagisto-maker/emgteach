<circle cx="88" cy="642" r="9" fill="#33383F" stroke="#C9CDD2" stroke-width="2.5"/><circle cx="88" cy="642" r="3.06" fill="#C9CDD2"/>
<text x="108" y="646" font-size="13" fill="#16202A"><tspan font-weight="bold">Recording electrodes</tspan>: two per muscle, 2 cm apart centre to centre, aligned with the fibres (along the muscle).</text>
<circle cx="88" cy="674" r="9" fill="#2E8B57" stroke="#DFF0E6" stroke-width="2.3"/><circle cx="88" cy="674" r="3" fill="#DFF0E6"/>
<text x="108" y="678" font-size="13" fill="#16202A"><tspan font-weight="bold">Reference electrode</tspan>: on bone, clear of muscle: olecranon or ulnar styloid. One per sensor.</text>
<circle cx="88" cy="704" r="6.5" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="2.4"/><circle cx="88" cy="704" r="2.2" fill="#1F3A5F"/>
<text x="108" y="708" font-size="13" fill="#1F3A5F">Skin clean, dry and free of cream. If the signal is small, move the pair 1–2 cm distally and check again.</text>
