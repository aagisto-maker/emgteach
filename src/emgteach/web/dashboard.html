<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>emgteach — Aula</title>
<style>
  :root { --blue:#4169E1; --red:#D62728; --ok:#1a7f37; --warn:#E67E22; --dang:#cc0000; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, Arial, sans-serif; background:#0f1420; color:#eef2f7; }
  header { display:flex; align-items:center; gap:10px; padding:10px 14px; background:#16203a; position:sticky; top:0; }
  header h1 { font-size:16px; margin:0; font-weight:700; }
  #conn { margin-left:auto; font-size:12px; display:flex; align-items:center; gap:6px; }
  .dot { width:10px; height:10px; border-radius:50%; background:#888; }
  .dot.on { background:#2ecc71; } .dot.off { background:#c0392b; }
  #rec { font-size:12px; color:#ff6b6b; font-weight:700; display:none; }
  #rec.on { display:inline; }
  main { padding:10px 12px 24px; max-width:900px; margin:0 auto; }
  /* Calibration banner */
  #calib { display:none; margin:6px 0 12px; padding:14px; border-radius:12px;
           background:#141626; text-align:center; }
  #calib.on { display:block; }
  #calib .title { font-size:18px; font-weight:700; margin-bottom:6px; }
  #calib .count { font-size:56px; font-weight:800; color:var(--blue); line-height:1; }
  #calib .bars { margin-top:10px; }
  .bar { height:14px; border-radius:7px; background:#2a2d3f; overflow:hidden; margin:6px 0; }
  .bar > i { display:block; height:100%; width:0; background:var(--blue); }
  .bar.effort > i { background:#2ecc71; }
  #calib .lbl { font-size:12px; color:#aeb6c4; }
  /* Channel cards */
  .ch { background:#141626; border-radius:12px; padding:12px; margin:10px 0; }
  .ch h2 { font-size:15px; margin:0 0 8px; display:flex; align-items:center; gap:8px; }
  .swatch { width:12px; height:12px; border-radius:3px; }
  canvas { width:100%; height:110px; display:block; background:#0b0e17; border-radius:8px; }
  .load { margin-top:10px; }
  .loadbar { position:relative; height:22px; border-radius:6px; background:#2a2d3f; overflow:hidden; }
  .loadbar > .fill { position:absolute; left:0; top:0; bottom:0; width:0; background:var(--ok); transition:width .12s linear; }
  .loadbar > .z { position:absolute; top:0; bottom:0; width:2px; }
  .loadbar > .zw { background:var(--warn); } .loadbar > .zd { background:var(--dang); }
  .loadtxt { display:flex; justify-content:space-between; font-size:12px; margin-top:4px; color:#c7cedb; }
  .pct { font-weight:700; }
  #wait { text-align:center; color:#8a93a6; padding:30px 10px; font-size:14px; }
  footer { text-align:center; color:#66708a; font-size:11px; padding:14px; }
  #tools { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; }
  button, .dlbtn { background:#20304a; color:#dfe7f3; border:1px solid #3a4a63;
                   border-radius:8px; padding:11px 15px; font-size:14px;
                   text-decoration:none; display:inline-block; cursor:pointer; }
  button:active, .dlbtn:active { background:#2c4064; }
  #results .resgrid { display:grid; grid-template-columns:1fr 1fr; gap:2px 14px; }
  #results .m { display:flex; justify-content:space-between; gap:8px; font-size:13px;
                border-bottom:1px solid #222838; padding:5px 0; }
  #results .m span { color:#aeb6c4; }
  #resDl { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
</style>
</head>
<body>
<header>
  <h1>emgteach · Aula</h1>
  <span id="rec">● REC</span>
  <span id="conn"><span id="dot" class="dot off"></span><span id="cs">conectando…</span></span>
</header>
<main>
  <div id="calib">
    <div class="title" id="cTitle"></div>
    <div class="count" id="cCount"></div>
    <div class="bars" id="cBars" style="display:none">
      <div class="bar"><i id="cProg"></i></div>
      <div class="lbl" id="cEffortLbl">Esfuerzo</div>
      <div class="bar effort"><i id="cEffort"></i></div>
    </div>
    <div class="lbl" id="cSub"></div>
  </div>
  <div id="wait">Esperando datos del profesor…</div>
  <div id="chs"></div>
  <div id="tools">
    <button id="btnCsv">⬇️ Descargar sesión (CSV)</button>
  </div>
  <div id="results" class="ch" style="display:none">
    <h2>📊 Resultados del análisis</h2>
    <div class="resgrid" id="resMetrics"></div>
    <div id="resDl"></div>
  </div>
</main>
<footer>Vista de seguimiento (solo lectura) · emgteach</footer>

<script>
const COLORS = ["#4169E1", "#D62728"];
const WIN = 600;                       // samples kept per channel for the plot
let nCh = 0, labels = [], warn = 40, danger = 70;
const bufs = [];                       // ring buffers of envelope per channel
const cards = [];                      // DOM refs per channel
let sessionRows = [], lastLoad = [], markers = [], sampleCount = 0;
const DT = 0.0125;                     // ~8 samples per 100 ms frame (session CSV)

function buildChannels() {
  const chs = document.getElementById("chs");
  chs.innerHTML = "";
  cards.length = 0; bufs.length = 0;
  for (let c = 0; c < nCh; c++) {
    bufs.push(new Array(WIN).fill(0));
    const col = COLORS[c % COLORS.length];
    const el = document.createElement("div");
    el.className = "ch";
    el.innerHTML = `
      <h2><span class="swatch" style="background:${col}"></span>${labels[c] || ("EMG " + (c+1))}</h2>
      <canvas></canvas>
      <div class="load">
        <div class="loadbar">
          <div class="fill"></div>
          <div class="z zw"></div><div class="z zd"></div>
        </div>
        <div class="loadtxt">
          <span class="pct">— % CVM</span>
          <span class="stats">P10 — · P50 — · P90 —</span>
        </div>
      </div>`;
    chs.appendChild(el);
    const cv = el.querySelector("canvas");
    cards.push({
      el, col, canvas: cv, ctx: cv.getContext("2d"),
      fill: el.querySelector(".fill"), zw: el.querySelector(".zw"),
      zd: el.querySelector(".zd"), pct: el.querySelector(".pct"),
      stats: el.querySelector(".stats"), max: 0.5,
    });
  }
  positionZones();
  document.getElementById("wait").style.display = nCh ? "none" : "block";
}

function positionZones() {
  for (const k of cards) {
    k.zw.style.left = warn + "%";
    k.zd.style.left = danger + "%";
  }
}

function pushData(env) {
  for (let c = 0; c < Math.min(env.length, nCh); c++) {
    const b = bufs[c], s = env[c];
    for (const v of s) { b.push(v); b.shift(); }
  }
}

function draw() {
  for (let c = 0; c < cards.length; c++) {
    const k = cards[c], ctx = k.ctx, b = bufs[c];
    const w = k.canvas.width = k.canvas.clientWidth * (window.devicePixelRatio || 1);
    const h = k.canvas.height = k.canvas.clientHeight * (window.devicePixelRatio || 1);
    ctx.clearRect(0, 0, w, h);
    let mx = 0; for (const v of b) if (v > mx) mx = v;
    k.max = Math.max(k.max * 0.95, mx, 0.05);         // smooth auto-scale
    ctx.strokeStyle = k.col; ctx.lineWidth = 2 * (window.devicePixelRatio || 1);
    ctx.beginPath();
    for (let i = 0; i < b.length; i++) {
      const x = (i / (b.length - 1)) * w;
      const y = h - (b[i] / k.max) * (h - 6) - 3;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();
  }
  requestAnimationFrame(draw);
}

function setLoad(chs) {
  for (let c = 0; c < Math.min(chs.length, cards.length); c++) {
    const k = cards[c], d = chs[c];
    if (!d.active) { k.pct.textContent = "— % CVM"; k.stats.textContent = "P10 — · P50 — · P90 —"; k.fill.style.width = "0%"; continue; }
    const col = d.zone === "danger" ? "var(--dang)" : d.zone === "warning" ? "var(--warn)" : "var(--ok)";
    k.fill.style.background = col;
    k.fill.style.width = Math.max(0, Math.min(100, d.pct)) + "%";
    k.pct.textContent = Math.round(d.pct) + " % CVM";
    k.pct.style.color = col;
    k.stats.textContent = `P10 ${Math.round(d.static)} · P50 ${Math.round(d.median)} · P90 ${Math.round(d.peak)}`;
  }
}

const cal = {
  box: document.getElementById("calib"), title: document.getElementById("cTitle"),
  count: document.getElementById("cCount"), bars: document.getElementById("cBars"),
  prog: document.getElementById("cProg"), effort: document.getElementById("cEffort"),
  sub: document.getElementById("cSub"),
};
function setCalib(d) {
  if (!d.active) { cal.box.classList.remove("on"); return; }
  cal.box.classList.add("on");
  cal.title.textContent = d.title || "";
  cal.sub.textContent = d.sub || "";
  if (d.phase === "ready") {
    cal.count.style.display = ""; cal.count.textContent = d.count;
    cal.bars.style.display = "none";
  } else if (d.phase === "contract") {
    cal.count.style.display = ""; cal.count.textContent = (d.secs != null ? Math.ceil(d.secs) : "") + " s";
    cal.bars.style.display = "block";
    cal.prog.style.width = Math.round((d.progress || 0) * 100) + "%";
    cal.effort.style.width = Math.round((d.effort || 0) * 100) + "%";
  } else if (d.phase === "rest") {
    cal.count.style.display = ""; cal.count.textContent = "🧘";
    cal.bars.style.display = "none";
  } else { // done
    cal.count.style.display = "none"; cal.bars.style.display = "none";
  }
}

// ---- WebSocket ----
let ws, retry = 0;
function connect() {
  ws = new WebSocket(`ws://${location.hostname}:{{WS_PORT}}`);
  ws.onopen = () => { retry = 0; dot(true); };
  ws.onclose = () => { dot(false); setTimeout(connect, Math.min(3000, 400 * ++retry)); };
  ws.onerror = () => ws.close();
  ws.onmessage = (e) => {
    let m; try { m = JSON.parse(e.data); } catch { return; }
    if (m.t === "config") {
      nCh = m.n; labels = m.labels || []; buildChannels();
      sessionRows = []; markers = []; sampleCount = 0;   // fresh session
      document.getElementById("rec").classList.toggle("on", !!m.recording);
    } else if (m.t === "data") {
      if (m.env) { pushData(m.env); accumulate(m.env); }
    } else if (m.t === "load") {
      if (m.warn != null) { warn = m.warn; danger = m.danger; positionZones(); }
      if (m.ch) { lastLoad = m.ch; setLoad(m.ch); }
    } else if (m.t === "calib") {
      setCalib(m);
    } else if (m.t === "marker") {
      markers.push({ t: m.time, label: m.label });
    } else if (m.t === "results") {
      showResults(m);
    } else if (m.t === "download") {
      addDownload(m);
    } else if (m.t === "status") {
      document.getElementById("rec").classList.toggle("on", !!m.recording);
    }
  };
}
function dot(on) {
  document.getElementById("dot").className = "dot " + (on ? "on" : "off");
  document.getElementById("cs").textContent = on ? "conectado" : "reconectando…";
}
// ---- session recording (client-side) + analysis results / downloads ----
function accumulate(env) {
  const n = env[0] ? env[0].length : 0;
  for (let i = 0; i < n; i++) {
    const row = [(sampleCount * DT).toFixed(3)];
    for (let c = 0; c < nCh; c++) row.push(env[c] && env[c][i] != null ? env[c][i] : "");
    for (let c = 0; c < nCh; c++)
      row.push(lastLoad[c] && lastLoad[c].active ? Math.round(lastLoad[c].pct) : "");
    sessionRows.push(row);
    sampleCount++;
  }
  if (sessionRows.length > 200000) sessionRows.splice(0, sessionRows.length - 200000);
}
function dl(text, type, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function downloadSessionCsv() {
  if (!sessionRows.length) { alert("Aún no hay datos de la sesión."); return; }
  const hdr = ["# emgteach — sesión en vivo (vista del alumno)"];
  if (markers.length)
    hdr.push("# marcadores: " + markers.map(x => `t=${x.t}s ${x.label}`).join("; "));
  const cols = ["t_s"]
    .concat(labels.map(l => `${l}_env_mV`))
    .concat(labels.map(l => `${l}_pctCVM`));
  const lines = [cols.join(",")].concat(sessionRows.map(r => r.join(",")));
  dl(hdr.join("\n") + "\n" + lines.join("\n"), "text/csv;charset=utf-8", "emgteach_sesion.csv");
}
document.getElementById("btnCsv").addEventListener("click", downloadSessionCsv);

function showResults(m) {
  document.getElementById("results").style.display = "block";
  const fat = m.fatigue < 0 ? "Detectada" : m.fatigue > 0 ? "No detectada" : "Indeterminada";
  const fc = m.fatigue < 0 ? "var(--dang)" : m.fatigue > 0 ? "var(--ok)" : "#c9a227";
  const items = [
    ["Archivo", m.file || "—"], ["Frec. media (MNF)", m.mnf + " Hz"],
    ["Frec. mediana (MDF)", m.mdf + " Hz"], ["Pendiente MDF", m.mdf_slope + " Hz/s"],
    ["RMS global", m.rms + " mV"], ["iEMG", m.iemg + " mV·s"],
    ["Duración", m.duration + " s"], ["Fatiga", `<b style="color:${fc}">${fat}</b>`],
  ];
  document.getElementById("resMetrics").innerHTML =
    items.map(([k, v]) => `<div class="m"><span>${k}</span><b>${v}</b></div>`).join("");
}
function addDownload(m) {
  document.getElementById("results").style.display = "block";
  const id = "dl_" + m.kind;
  let a = document.getElementById(id);
  if (!a) {
    a = document.createElement("a"); a.id = id; a.className = "dlbtn";
    document.getElementById("resDl").appendChild(a);
  }
  a.href = m.url; a.setAttribute("download", m.name || "");
  a.textContent = m.kind === "report"
    ? "⬇️ Descargar informe (PDF)" : "⬇️ Descargar resultados (CSV)";
}

connect();
requestAnimationFrame(draw);
</script>
</body>
</html>
