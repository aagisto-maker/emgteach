name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One run per branch. Force-pushing to a pull request does not cancel the run
# already going: without this, the superseded one keeps its runners to the end
# — twelve of them for this workflow — and on 20 September four zombie runs
# between two sessions jammed the queue until they were cancelled by hand.
#
# Only a pull request is cancelled. A push to main is the one commit that has
# to be tested whatever else is happening, and two merges close together would
# otherwise leave the first one untested; a tag build and a manual run are not
# things anybody wants taken away either.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} — Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    # A GUI test that hangs used to hold the job for six hours. The job now
    # gives up after half an hour, and pytest's faulthandler dumps the stack
    # of whatever was running after ten minutes, so the log says where.
    # That covers a hang and only a hang: an abort is not a timeout and not a
    # signal either, so the stack of one has to come from the Qt message
    # handler that tests/conftest.py installs.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Qt platform libraries (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libdbus-1-3

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Type-check with mypy (non-blocking)
        run: mypy src/emgteach
        continue-on-error: true

      - name: Run tests with coverage
        env:
          QT_QPA_PLATFORM: offscreen
          # Unbuffered, so a process that dies without flushing still leaves
          # the log stopping exactly where it died. Twice on 19 September this
          # job ended mid-report with nothing said, and the few hundred lines
          # sitting in the buffer went with it.
          PYTHONUNBUFFERED: "1"
        run: pytest --cov=emgteach --cov-report=term-missing --cov-report=xml -m "not hardware" -o faulthandler_timeout=600

      - name: Validate numerical accuracy of the metrics
        run: python validation/validate_metrics.py

      - name: Upload coverage to Codecov (Linux + 3.12 only, non-blocking)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build with hatch
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build
      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
