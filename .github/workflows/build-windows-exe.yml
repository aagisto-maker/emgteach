name: Build Windows exe

# Builds the two standalone Windows executables with the recipes in
# packaging/ (see packaging/README.md) — the application, emgteach.exe, and
# the connection diagnostic, diagnostico_bitalino.exe — self-tests each one
# frozen, and keeps both as workflow artifacts.
#
# The versions are the ones the laboratory kit is built with:
# packaging/requirements-exe.txt pins the runtime dependencies and PyInstaller
# to that build environment's versions, used here as constraints, so two
# builds weeks apart bundle the same libraries.
#
# A manual run (workflow_dispatch) also has GitHub attest where the two
# executables were built (actions/attest-build-provenance). That run's
# executable is the one tried at the bench, and the one the release publishes.
#
# A version tag (after v3.8.0) does not build again: PyInstaller does not
# reproduce a file byte for byte, so a second build would publish an
# executable nobody tried. The release job looks for the latest successful
# manual run of this workflow on the tag's own commit, verifies the
# attestation of its executable (built by this workflow, from that commit),
# checks that it says the tag's version, renames it
# emgteach-vX.Y.Z-windows-x64.exe and creates a **draft** release with the
# version's notes (docs/RELEASE_NOTES_vX.Y.Z.md), the number of the run it
# came from, its SHA-256 and the executable. Without such a run it fails and
# creates nothing. A draft is not published, so Zenodo — which archives on
# publication — is not told yet: the executable goes through VirusTotal
# first, and the draft is published by hand. The executable is not signed;
# the README says what Windows shows and how to check the file. The
# diagnostic stays a workflow artifact only. CONTRIBUTING.md has the
# procedure.
#
# workflow_dispatch only becomes available once this file is on the default
# branch; the pull_request trigger (scoped to packaging changes) lets a PR
# produce a test build before that.
on:
  workflow_dispatch:
  push:
    tags:
      - "exe-*"
      - "v*"
  pull_request:
    branches: [main]
    paths:
      - "packaging/**"
      - ".github/workflows/build-windows-exe.yml"

# One run per branch. Force-pushing to a pull request does not cancel the run
# already going: without this, the superseded one keeps its runners to the end
# — twelve of them for this workflow — and on 20 September four zombie runs
# between two sessions jammed the queue until they were cancelled by hand.
#
# Only a pull request is cancelled. A push to main is the one commit that has
# to be tested whatever else is happening, and two merges close together would
# otherwise leave the first one untested; a tag build and a manual run are not
# things anybody wants taken away either.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-exe:
    name: PyInstaller one-file build (Windows)
    # Not on a version tag: the release takes the executable of the manual run
    # on the same commit (see release-draft), never a new build.
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]" -c packaging/requirements-exe.txt

      - name: Build emgteach.exe
        run: pyinstaller --noconfirm --clean packaging/emgteach.spec

      - name: Self-test emgteach.exe (headless)
        env:
          QT_QPA_PLATFORM: offscreen
        # The exe is windowed (no console), so PowerShell won't wait for it
        # on its own — Start-Process -Wait does. The outcome lands in
        # emgteach_selftest.log next to the executable.
        run: |
          $p = Start-Process -FilePath "dist\emgteach.exe" -ArgumentList "--selftest" -Wait -PassThru -NoNewWindow
          Get-Content dist\emgteach_selftest.log
          exit $p.ExitCode

      - name: Build diagnostico_bitalino.exe
        run: pyinstaller --noconfirm --clean packaging/diagnostico_bitalino.spec

      - name: Self-test diagnostico_bitalino.exe on the simulated board
        # A console program: it runs the whole diagnosis against the board
        # simulated in software and exits 0 when the station would be ready.
        # The empty line answers its «Press Enter to close».
        run: |
          "" | dist\diagnostico_bitalino.exe simulada --seconds 2
          $code = $LASTEXITCODE
          Get-ChildItem dist\diagnostico_bitalino_*.txt | Get-Content
          exit $code

      - name: Upload the executables
        uses: actions/upload-artifact@v4
        with:
          name: emgteach-windows-exe
          # The self-test log says the version the executable reports, which
          # the release checks against the tag.
          path: |
            dist/emgteach.exe
            dist/diagnostico_bitalino.exe
            dist/emgteach_selftest.log
          if-no-files-found: error
          compression-level: 6

  attest:
    name: Attest the executables of a manual run
    # A manual run is the one whose executable is tried at the bench and then
    # published; its attestation is what the release verifies. Pull requests
    # and exe-* tags build and test, and stop there.
    if: github.event_name == 'workflow_dispatch'
    needs: build-exe
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write           # mint the OIDC token Sigstore signs with
      attestations: write       # store the provenance attestation
      artifact-metadata: write  # the artifact storage record the attestation needs
    steps:
      - name: Download the executables
        uses: actions/download-artifact@v4
        with:
          name: emgteach-windows-exe
          path: dist

      - name: Attest where they were built
        # The attestation is bound to each file's digest, not its name: the
        # release renames the application and the attestation still holds.
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/emgteach.exe
            dist/diagnostico_bitalino.exe

      - name: Say what was built
        run: |
          {
            echo "Run ${{ github.run_id }} on ${{ github.sha }}"
            echo
            echo '```'
            sha256sum dist/emgteach.exe dist/diagnostico_bitalino.exe
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release-draft:
    name: Draft release with the tested executable
    # Version tags only. Nothing is built here: the executable is the one the
    # manual run on this commit built, attested and left as its artifact.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write           # create the draft release and upload to it
      actions: read             # find the manual run and download its artifact
      attestations: read        # read the attestation to verify it
    env:
      TAG: ${{ github.ref_name }}
      SHA: ${{ github.sha }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v5

      - name: The version in the code is the tag's
        # A release of v3.9.0 must not be cut from a commit that calls itself
        # 3.8.0: the version is bumped before the tag, and this is where a tag
        # put on the wrong commit is caught.
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v${version}" != "$TAG" ]; then
            echo "::error::pyproject.toml says ${version}; the tag is ${TAG}. Nothing was created."
            exit 1
          fi

      - name: Find the manual run on this commit
        # The latest successful manual run of this workflow on exactly this
        # commit. Its attest job ran, or the run would not be a success.
        run: |
          run=$(gh api "repos/${REPO}/actions/workflows/build-windows-exe.yml/runs?event=workflow_dispatch&status=success&head_sha=${SHA}&per_page=1" \
                --jq '.workflow_runs[0].id // empty')
          if [ -z "$run" ]; then
            echo "::error::No successful manual run of build-windows-exe.yml on ${SHA}. Run the workflow on this commit (Actions → Build Windows exe → Run workflow), try its executable, then re-run this job. Nothing was created."
            exit 1
          fi
          echo "RUN_ID=${run}" >> "$GITHUB_ENV"
          echo "RUN_URL=https://github.com/${REPO}/actions/runs/${run}" >> "$GITHUB_ENV"
          echo "Manual run ${run} on ${SHA}" >> "$GITHUB_STEP_SUMMARY"

      - name: Download its executables
        run: gh run download "$RUN_ID" --repo "$REPO" --name emgteach-windows-exe --dir dist

      - name: Verify the attestation
        # Built by this workflow, in this repository, from this commit.
        run: |
          gh attestation verify dist/emgteach.exe --repo "$REPO" \
            --signer-workflow "${REPO}/.github/workflows/build-windows-exe.yml" \
            --source-digest "$SHA" --deny-self-hosted-runners

      - name: The executable says the tag's version
        run: |
          version="${TAG#v}"
          cat dist/emgteach_selftest.log
          if ! grep -qF "SELFTEST OK: emgteach ${version} " dist/emgteach_selftest.log; then
            echo "::error::The executable of run ${RUN_ID} does not say version ${version}. Nothing was created."
            exit 1
          fi

      - name: Name the executable after the tag
        run: |
          mv dist/emgteach.exe "dist/emgteach-${TAG}-windows-x64.exe"
          ls -l dist

      - name: Write the release notes, with the run and the SHA-256
        run: |
          notes="docs/RELEASE_NOTES_${TAG}.md"
          test -f "$notes" || { echo "::error::$notes does not exist"; exit 1; }
          exe="emgteach-${TAG}-windows-x64.exe"
          sha=$(sha256sum "dist/$exe" | cut -d' ' -f1)
          {
            cat "$notes"
            echo
            echo "## SHA-256 of the executable"
            echo
            echo '```'
            echo "$sha  $exe"
            echo '```'
            echo
            echo "Built and attested by run [${RUN_ID}](${RUN_URL}) of *Build Windows exe*"
            echo "on \`${SHA}\`: the executable tried before the tag, not a new build."
          } > release-notes.md
          # The title is the notes' first line without its «# emgteach X.Y.Z — ».
          title=$(head -n1 "$notes" | sed -E 's/^# *emgteach [^ ]+ — //')
          echo "RELEASE_TITLE=${TAG} — ${title}" >> "$GITHUB_ENV"
          echo "$sha  $exe (run ${RUN_ID})" >> "$GITHUB_STEP_SUMMARY"

      - name: Create the draft release
        # A draft and never a published release: publishing is what Zenodo
        # archives, and it waits for the VirusTotal check. Refuses to touch a
        # release that already exists, so a re-run cannot change what was
        # published.
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::A release for $TAG already exists; nothing was changed."
            exit 1
          fi
          gh release create "$TAG" --draft --verify-tag \
            --title "$RELEASE_TITLE" --notes-file release-notes.md \
            "dist/emgteach-${TAG}-windows-x64.exe"
